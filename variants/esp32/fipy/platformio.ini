; Pycom FiPy - ESP32 with LoRa (SX1276), LTE-M/NB-IoT, Sigfox, WiFi, BLE
; Based on LoPy4 configuration: https://meshtastic.discourse.group/t/pycom-lopy4-basic-functionality/7153
; Note: This is community/DIY support - not officially supported by Meshtastic
[env:fipy]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = Pycom FiPy
custom_meshtastic_images = diy.svg
custom_meshtastic_tags = DIY,Community

extends = esp32_base
board = lopy4
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32/fipy
